
name: Build SixSlot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Extract Android project
        run: |
          unzip -q SixSlot-Android-Launcher.zip -d source
          test -f source/SixSlotLauncher/app/build.gradle.kts

      - name: Build APK
        run: gradle -p source/SixSlotLauncher assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SixSlot-Launcher-APK
          path: source/SixSlotLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
